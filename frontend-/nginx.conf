server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas del frontend - todas van a index.html para Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para el backend API
    location /api/ {
        proxy_pass https://thedetailer.up.railway.app/api/;
        proxy_http_version 1.1;

        # Headers necesarios para proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Bloquear acceso directo a archivos sensibles
    location ~ /\. {
        deny all;
    }
}
