[build]
  base = "frontend-"
  command = "npm run build"
  publish = "dist/app-theDetailer/browser"

# Proxy al backend de Railway — debe ir ANTES de la regla /* del SPA
[[redirects]]
  from = "/api/*"
  to = "https://thedetailer.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development" }
